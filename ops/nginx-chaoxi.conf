# chaoxi.tech 站点配置
# 证书由 acme.sh 管理：续期后 --install-cert 会写到 /etc/nginx/ssl/ 并 reload nginx

server {
    listen 80;
    server_name chaoxi.tech www.chaoxi.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chaoxi.tech www.chaoxi.tech;

    ssl_certificate     /etc/nginx/ssl/chaoxi.tech.crt;
    ssl_certificate_key /etc/nginx/ssl/chaoxi.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- 前端：Vite 构建出来的静态文件 ----
    root /var/www/chaoxi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 ----
    # 注意 proxy_pass 结尾【没有】斜杠，见下方说明
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DeepSeek 偶尔慢，默认 60s 容易断
        proxy_read_timeout 300s;
    }
}

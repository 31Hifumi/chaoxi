name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5

      - name: 跑 pytest
        run: uv run pytest -q
        # 测试不联网：LLM 通过依赖覆盖换成假的，密钥用 monkeypatch 塞的假值

  frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - name: 跑 vitest
        run: npx vitest run
